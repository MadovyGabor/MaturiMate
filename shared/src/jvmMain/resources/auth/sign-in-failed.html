<!DOCTYPE html>
<!-- The page the browser shows when a Google sign-in on the desktop was cancelled or failed (core/network).
     Slovak first (the app's default), then Hungarian; no images, nothing loaded from elsewhere. -->
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MaturiMate</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 32rem; padding: 2rem 1rem; text-align: center; line-height: 1.5; }
        h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
        p { margin: 0 0 0.25rem; }
        section + section { margin-top: 1.5rem; }
    </style>
</head>
<body>
<main>
    <h1>MaturiMate</h1>
    <section lang="sk">
        <p><strong>Prihlásenie sa nepodarilo.</strong></p>
        <p>Vráť sa do aplikácie MaturiMate a skús to znova. Toto okno môžeš zavrieť.</p>
    </section>
    <section lang="hu">
        <p><strong>A bejelentkezés nem sikerült.</strong></p>
        <p>Térj vissza a MaturiMate alkalmazásba, és próbáld újra. Ezt az ablakot bezárhatod.</p>
    </section>
</main>
</body>
</html>
