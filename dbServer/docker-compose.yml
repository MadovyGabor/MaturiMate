# Local development database. On the first start (empty volume) it creates a stand-in for
# Supabase Auth (postgres/00_auth_stub.sql) and applies supabase/migrations in order.
name: maturimate
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - ../supabase/migrations:/migrations:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
