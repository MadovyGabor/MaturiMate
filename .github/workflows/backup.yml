name: Backup

# A daily, encrypted backup of the user data (roadmap 12.2): the user tables and auth.users, through the session pooler
# of Supabase, encrypted with age (the private key is only with the owner) and put into the private R2 bucket
# `maturimate-backup`. The content tables are left out: the private content repository and the importer restore them.
# Details and the restore: docs/runbooks/backup.md and docs/runbooks/restore.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency: backup

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pg_dump must not be older than the server (Supabase runs PostgreSQL 17)
      - name: Install the PostgreSQL 17 client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age

      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --table=public.user_profile --table=public.user_settings --table=public.user_subject --table=public.user_role \
            --table=public.user_consent --table=public.consent_archive --table=public.attempt --table=public.attempt_answer \
            --table=public.user_unit_progress --table=public.user_streak --table=public.activity_log \
            --table=public.content_download --table=public.content_report --table=public.exam_date --table=public.content_release \
            --file="user-$DATE.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --table=auth.users --table=auth.identities --file="auth-$DATE.dump"

      - name: Encrypt
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          age -r "$AGE_PUBLIC_KEY" -o "user-$DATE.dump.age" "user-$DATE.dump"
          age -r "$AGE_PUBLIC_KEY" -o "auth-$DATE.dump.age" "auth-$DATE.dump"
          rm -f "user-$DATE.dump" "auth-$DATE.dump"
          ls -l ./*.age | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"

      # R2 speaks the S3 API; the aws cli is on the runner
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in user-$DATE.dump.age auth-$DATE.dump.age; do
            aws s3 cp "$f" "s3://$R2_BUCKET/$DATE/$f" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          done
