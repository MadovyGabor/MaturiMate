name: CI

# Every push to any branch; a pull request shows the result of its branch's push, so there is no
# separate pull_request run (it would test the same commit twice). Changes that touch only
# documentation start no run; tokens.json is the exception, the theme test checks it.
on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/design-system/tokens.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # test reports appear as separate checks

# One job per part, so a red job shows at once which part broke.
# Each job publishes its JUnit results as a check and as a table in the run summary.
jobs:
  database:
    name: Database (SQLDelight)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew :database:jvmTest

      # line coverage in the log and the run summary; fails under 80 %
      - name: Coverage
        run: |
          ./gradlew :database:koverLog :database:koverVerify --console=plain | tee kover.txt
          grep "line coverage" kover.txt | sed 's/^/Database: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Database tests
          report_paths: database/build/test-results/jvmTest/*.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

  content-pipeline:
    name: Content pipeline (validator, exporter, PostgreSQL importer)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway PostgreSQL for the importer tests; they load the auth stand-in and supabase/migrations themselves
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maturimate
          POSTGRES_USER: maturimate
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maturimate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maturimate:ci-only@localhost:5432/maturimate
      REQUIRE_POSTGRES: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Schema migrations and row level security tests
        env:
          PGPASSWORD: ci-only
        run: |
          createdb -h localhost -U maturimate rls_test
          for f in dbServer/postgres/00_auth_stub.sql supabase/migrations/*.sql supabase/tests/rls_test.sql supabase/tests/sync_test.sql; do
            psql -h localhost -U maturimate -d rls_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Tests
        run: ./gradlew :tools:content-pipeline:test

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Content pipeline tests
          report_paths: tools/content-pipeline/build/test-results/test/*.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

  worker:
    name: Worker (content link)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/content-link
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/content-link/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The app's tests, split into groups that run side by side (a red group names the broken part).
  # The groups and their test packages are the table testGroups in shared/build.gradle.kts;
  # "other" is every test that is in no named group. No test is retried: a red test is a real finding.
  app-tests:
    name: "App: ${{ matrix.title }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: frame, title: Frame }
          - { group: onboarding, title: Onboarding }
          - { group: auth, title: Auth }
          - { group: settings, title: Settings }
          - { group: reminder, title: Reminder }
          - { group: profile, title: Profile }
          - { group: other, title: Other }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Bundle the made-up test content, so the app's content provider test runs too (every group, for simplicity)
      - name: Bundle test content
        run: ./gradlew :tools:content-pipeline:bundleContent -PcontentDir=tools/content-pipeline/src/test/resources/content-valid -PcontentKind=starter -PcontentVersion=2000010101

      - name: Tests
        env:
          GROUP: ${{ matrix.group }}
        run: ./gradlew :shared:jvmTest "-PtestGroup=$GROUP"

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: "App: ${{ matrix.title }} tests"
          report_paths: shared/build/test-results/jvmTest/*.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Group table
        if: always()
        env:
          TITLE: ${{ matrix.title }}
        run: python3 .github/scripts/junit_summary.py group "$TITLE" shared/build/test-results/jvmTest

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.group }}
          path: shared/build/test-results/jvmTest/*.xml
          if-no-files-found: warn
          retention-days: 14

  # The whole suite once more: coverage (80 %) and the test count that ci-result compares with the
  # sum of the groups
  coverage:
    name: "App: Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Bundle test content
        run: ./gradlew :tools:content-pipeline:bundleContent -PcontentDir=tools/content-pipeline/src/test/resources/content-valid -PcontentKind=starter -PcontentVersion=2000010101

      # runs every test, then the line coverage in the log and the run summary; fails under 80 %
      - name: Tests and coverage
        run: |
          ./gradlew :shared:koverLog :shared:koverVerify --console=plain | tee kover.txt
          grep "line coverage" kover.txt | sed 's/^/App: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-whole
          path: shared/build/test-results/jvmTest/*.xml
          if-no-files-found: warn
          retention-days: 14

  # The desktop jar is its own job, so a failed build and a failed test are different red marks
  desktop-build:
    name: "App: Desktop build"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build desktop
        run: ./gradlew :desktopApp:jar

  # The Android build is the slowest part, so it runs beside the tests instead of after them
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Android
        run: ./gradlew :androidApp:assembleDebug

  # The one status check to require on GitHub: green only when every job above passed and the
  # groups together ran exactly the tests of the whole suite
  ci-result:
    name: CI result
    if: always()
    needs: [database, content-pipeline, worker, app-tests, coverage, desktop-build, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: results

      - name: Result table
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/junit_summary.py total results --whole results/junit-whole
